name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  build:
    name: Build & Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev musl-tools

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build contextd (Static)
        env:
          LIBUDEV_STATIC: 1
        run: cargo build --release --target ${{ matrix.target }}


      - name: Assemble Portable Image
        run: ./scripts/package-portable.sh dist/contextd target/${{ matrix.target }}/release/contextd


      - name: Create Tarball
        run: |
          cd dist
          tar -czvf ../contextd-portable-${{ github.ref_name }}.tar.gz contextd/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            contextd-portable-${{ github.ref_name }}.tar.gz
            target/${{ matrix.target }}/release/contextd
          generate_release_notes: true
          draft: false
          prerelease: false


