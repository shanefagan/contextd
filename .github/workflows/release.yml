name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build contextd
        run: cargo build --release

      - name: Assemble Portable Image
        run: ./scripts/package-portable.sh dist/contextd target/release/contextd

      - name: Create Tarball
        run: |
          cd dist
          tar -czvf ../contextd-portable-${{ github.ref_name }}.tar.gz contextd/

      - name: Generate Changelog
        uses: anton-yurchenko/git-release-changelog-generator@v3
        with:
          patch: true

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            contextd-portable-${{ github.ref_name }}.tar.gz
            target/release/contextd
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
