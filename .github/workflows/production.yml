name: Production Build & Release

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  NAME: contextd
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Read-only by default; only the release job can write.
permissions:
  contents: read

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --verbose

      - name: Verify systemd units
        run: |
          for unit in packaging/*.service packaging/*.socket; do
            # Binaries are not installed on the runner; everything else must pass.
            systemd-analyze verify --man=no "$unit" 2>&1 | grep -v "is not executable" | tee /tmp/verify.log
            test ! -s /tmp/verify.log
          done

  security_audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Package
    needs: [test, security_audit]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libudev-dev rpm

    - name: Set Version
      id: vars
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION="0.0.0-dev"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Build
      run: cargo build --release --workspace --locked

    - name: Prepare Artifacts Directory
      run: mkdir -p dist

    - name: Build Portable Tarball
      run: |
        ./scripts/package-portable.sh build/release target/release
        tar -C build -czvf dist/${{ env.NAME }}-${{ env.VERSION }}-x86_64-portable.tar.gz release/

    - name: Build DEB Package
      run: |
        sed -i "s/^Version:.*/Version: ${VERSION#v}/" packaging/debian/control

        mkdir -p build/deb/DEBIAN build/deb/opt
        cp packaging/debian/control packaging/debian/postinst packaging/debian/prerm build/deb/DEBIAN/
        chmod 755 build/deb/DEBIAN/postinst build/deb/DEBIAN/prerm

        # Portable image in /opt, host-side files in /usr
        cp -a build/release/contextd build/deb/opt/${{ env.NAME }}
        cp -a build/release/host/usr build/deb/usr

        dpkg-deb --root-owner-group --build build/deb dist/${{ env.NAME }}-${{ env.VERSION }}-amd64.deb

    - name: Build RPM Package
      run: |
        RAW_VER=${VERSION#v}
        # RPM Version cannot contain hyphens, replace with dots for pre-releases
        RPM_VER=$(echo $RAW_VER | tr '-' '.')
        sed -i "s/^Version:.*/Version: ${RPM_VER}/" packaging/rpm/contextd.spec

        mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
        tar -czf rpmbuild/SOURCES/${{ env.NAME }}-${RPM_VER}.tar.gz \
          --exclude="./target" \
          --exclude="./build" \
          --exclude="./rpmbuild" \
          --exclude="./dist" \
          --exclude="./.git" \
          --exclude="./.github" \
          --transform "s|^\.|${{ env.NAME }}-${RPM_VER}|" .

        rpmbuild -ba packaging/rpm/contextd.spec --define "_topdir $(pwd)/rpmbuild" --nodeps
        cp rpmbuild/RPMS/x86_64/*.rpm dist/${{ env.NAME }}-${{ env.VERSION }}-x86_64.rpm

    - name: Upload Workspace Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: contextd-builds
        path: dist/*

  release:
    name: Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v7
      with:
        name: contextd-builds
        path: dist

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*
        generate_release_notes: true
        draft: false
        prerelease: false
