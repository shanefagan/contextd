[package]
name = "contextd-client"
version = "0.1.0"
edition = "2024"
authors = ["Shane Fagan <shane@performativenonsense.com>"]
homepage = "https://github.com/shanefagan/contextd"
repository = "https://github.com/shanefagan/contextd"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
serde_json = "1.0"
log = "0.4"
thiserror = "2.0"
varlink = "13.0"

[build-dependencies]
varlink_generator = "13.0"
