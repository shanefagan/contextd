[workspace]
resolver = "2"
members = [
    ".",
    "contextd-client",
    "bridges/openrgb-contextd-bridge",
    "helpers/contextd-focus",
]
exclude = [
    "packaging/**",
    "build/**",
]

[package]
name = "contextd"
version = "0.10.0"
edition = "2024"
authors = ["Shane Fagan <shane@performativenonsense.com>"]
homepage = "https://github.com/shanefagan/contextd"
repository = "https://github.com/shanefagan/contextd"
license = "MIT"

[dependencies]
contextd-client = { path = "contextd-client" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
varlink = "13.0"
udev = "0.9"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
rusqlite = { version = "0.42", features = ["bundled"] }
sysinfo = "0.40"
libc = "0.2"
toml = "1.1.2"
yaml-rust2 = "0.13.0"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
